# Render Blueprint for the API server (the client is on Vercel).
# Render → New → Blueprint → pick this repo. Values marked `sync: false` are
# prompted for on first deploy and never stored in git.
#
# Free plan caveats: the service sleeps after ~15 min idle (first request then
# takes ~30–60s), and live interviews are lost if it sleeps mid-session. There's
# no persistent disk, so interview history lives in Supabase
# (SUPABASE_SERVICE_ROLE_KEY below + the interview_history migration); only
# today's usage counters (usage.json) still reset on a restart.
services:
  - type: web
    name: jobuddy-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Render terminates TLS at its proxy in front of the app.
      - key: TRUST_PROXY
        value: "1"
      - key: FORCE_HTTPS
        value: "true"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: SUPABASE_URL
        sync: false
      # Server-only secret: interview history (and plans) in Supabase.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Your Vercel URL, e.g. https://jobuddy.vercel.app (comma-separate several).
      - key: CLIENT_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
